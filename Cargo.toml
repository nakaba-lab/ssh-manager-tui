[package]
name = "sshm-tui"
version = "1.2.0"
edition = "2024"
rust-version = "1.94"
description = "A TUI SSH host manager for ~/.ssh/config"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nakaba-lab/ssh-manager-tui"
homepage = "https://github.com/nakaba-lab/ssh-manager-tui"
readme = "README.md"
keywords = ["ssh", "tui", "ssh-config", "terminal", "ratatui"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "CLAUDE.md", "packaging/"]

[[bin]]
name = "sshm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.11"
dirs = "6.0.0"
getrandom = "0.2"
nucleo-matcher = "0.3.1"
ratatui = "0.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# 0.60 matches a windows-sys generation already in the tree (via arboard), so the
# windows-targets import-library crate-set de-duplicates to one generation.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Console",
] }

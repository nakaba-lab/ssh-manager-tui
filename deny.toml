# cargo-deny config: advisory + supply-chain + license gate for the release pipeline.
[advisories]
yanked = "deny"
ignore = []

# OSS ライセンスゲート: 依存ツリーに現れてよいライセンスを明示的に allow する。
# ここに無いライセンス（GPL/AGPL/LGPL 等の強コピーレフト含む）が混入すると
# `cargo deny check licenses` が fail する（納品・再配布の互換性を守る）。
# 現在の allow は実ツリーで使われている permissive 群 + weak-copyleft の MPL-2.0
# （nucleo-matcher が MPL-2.0。ファイル単位の弱コピーレフトで、改変しない限り
# permissive 配布と両立するため受容）。新しい permissive ライセンスの依存が増えたら
# ここに追記する（追記＝意図的なライセンス受容の記録）。
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

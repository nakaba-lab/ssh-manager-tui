name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Edition 2024 needs a recent toolchain; stable on GitHub runners is well
      # ahead of the MSRV pinned in Cargo.toml (rust-version = "1.94").
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Most #[cfg(test)] modules are pure (parsing / arg-building). A few DO
      # spawn real OpenSSH at runtime — os::resolve tests run `ssh -G` and
      # `ssh-keygen -H` — which is why OpenSSH must be on the runner (ubuntu:
      # openssh-client; windows: bundled OpenSSH client). Those ssh-spawning
      # tests can flake (e.g. `ssh -G` timing out on a cold Windows runner);
      # re-run the job or harden them (nextest --retries / #[ignore]).
      - name: Test
        run: cargo test --all

  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Surface RUSTSEC advisories / yanked crates in the dependency graph — the
      # vault's crypto stack (argon2, chacha20poly1305, zeroize, getrandom) is the
      # app's weak link, so an advisory landing there must not ship silently.
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

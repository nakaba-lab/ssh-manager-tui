name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Edition 2024 needs a recent toolchain; stable on GitHub runners is well
      # ahead of the minimum, and Cargo.toml pins no rust-version/MSRV.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The test suite is pure: every #[cfg(test)] module exercises parsing /
      # arg-building only (parse_fingerprint_line, build_ssh_args, parse_line,
      # config round-trip), so no test spawns ssh / ssh-keygen / wt at runtime.
      # OpenSSH is preinstalled on both runners anyway (ubuntu: openssh-client;
      # windows: bundled OpenSSH client) if that ever changes.
      - name: Test
        run: cargo test --all

  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Surface RUSTSEC advisories / yanked crates in the dependency graph — the
      # vault's crypto stack (argon2, chacha20poly1305, zeroize, getrandom) is the
      # app's weak link, so an advisory landing there must not ship silently.
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

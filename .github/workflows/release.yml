name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single advisory/quality gate the publish job depends on, so a `git tag && push`
  # that bypasses a PR to main still runs fmt/clippy/test + cargo audit + cargo deny.
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Install cargo-audit and cargo-deny
        # Pin tool majors so a surprise upstream release can't break a tagged build.
        # REMINDER: Dependabot does NOT bump `cargo install` tools, so re-pin these
        # deliberately whenever the RustSec advisory format moves. A stale `^0.16`
        # resolved to cargo-deny 0.16.4, which could not parse CVSS-v4.0 advisories
        # and broke EVERY release until bumped to `^0.19`. Re-check on each major.
        run: cargo install cargo-audit --version "^0.22" --locked && cargo install cargo-deny --version "^0.19" --locked
      - run: cargo audit
      - run: cargo deny check advisories bans sources

  release:
    name: release (${{ matrix.target }})
    # Gate the publish on the quality job; the protected `release` environment (set
    # up in repo Settings -> Environments with required reviewers) adds a human gate.
    needs: gate
    environment: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Install via the matrix target so cross-target builds (e.g.
      # x86_64-apple-darwin on the arm64 macos runner) get the right std.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # The download filename uses VERSION with no leading 'v'; the tag
      # (github.ref_name) carries it, so strip exactly one leading 'v'.
      # Asset base name = sshm-<VERSION>-<target>.
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $base = "sshm-$version-${{ matrix.target }}"
          $asset = "$base.zip"
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/stage" -Force
          Copy-Item "target/${{ matrix.target }}/release/sshm.exe" -Destination $stage
          Copy-Item "LICENSE-MIT","LICENSE-APACHE","README.md" -Destination $stage
          # Compress the staged contents so sshm.exe + docs sit at the archive ROOT.
          Compress-Archive -Path "$($stage.FullName)/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          # Exact format for Scoop: <hash><two spaces><filename>, no trailing newline games.
          Set-Content -Path "$asset.sha256" -Value "$hash  $asset" -NoNewline
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="sshm-${version}-${{ matrix.target }}"
          asset="${base}.tar.gz"
          # -C into the release dir for the binary, and into the repo root for the
          # docs, so everything lands at the archive ROOT (no nested dirs).
          tar -czf "$asset" \
            -C "target/${{ matrix.target }}/release" sshm \
            -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE README.md
          if [ "$RUNNER_OS" = "macOS" ]; then
            hash="$(shasum -a 256 "$asset" | awk '{print $1}')"
          else
            hash="$(sha256sum "$asset" | awk '{print $1}')"
          fi
          # Exact format for Scoop: hash, two spaces, filename.
          printf '%s  %s' "$hash" "$asset" > "${asset}.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Attach assets to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
